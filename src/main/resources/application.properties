spring.application.name=english-practice-platform
# 激活 local 配置，Spring 会额外加载 application-local.properties
spring.profiles.active=local
# 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/english_practice?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
# JPA
# 表结构由 Flyway 管理（src/main/resources/db/migration），Hibernate 只检查实体和表是否一致
spring.jpa.hibernate.ddl-auto=validate

# 已有数据库第一次接入 Flyway：把现有表结构登记为版本 1，不重复执行 V1
# 全新的空数据库不受影响，会正常执行 V1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Thymeleaf
spring.thymeleaf.cache=false
# 只用 Cookie 跟踪会话，禁止把会话 ID 写进网址
server.servlet.session.tracking-modes=cookie