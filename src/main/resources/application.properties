spring.application.name=english-practice-platform

# 激活 local 配置，Spring 会额外加载 application-local.properties
spring.profiles.active=local

# 数据源
spring.datasource.url=jdbc:mysql://localhost:3306/english_practice?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false