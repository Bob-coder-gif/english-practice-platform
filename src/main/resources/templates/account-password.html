<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('修改密码')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">
  <div class="app-card p-4 mx-auto" style="max-width: 420px;">
    <h1 class="h4 mb-3 text-center">修改密码</h1>

    <p class="text-muted-app small mb-3">
      修改后，其他设备上的「记住我」会失效，需要用新密码重新登录。
    </p>

    <!-- 密码框都不用 th:field：出错重新显示页面时，不把输入过的密码填回去 -->
    <form th:action="@{/account/password}" th:object="${changePasswordForm}" method="post" novalidate>
      <div class="mb-3">
        <label for="currentPassword" class="form-label">当前密码</label>
        <input type="password" id="currentPassword" name="currentPassword" class="form-control"
               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{currentPassword}">[当前密码错误]</div>
      </div>

      <div class="mb-3">
        <label for="newPassword" class="form-label">新密码</label>
        <input type="password" id="newPassword" name="newPassword" class="form-control"
               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">
        <div class="form-text">6～32 位</div>
        <div class="invalid-feedback" th:errors="*{newPassword}">[新密码错误]</div>
      </div>

      <div class="mb-4">
        <label for="confirmPassword" class="form-label">确认新密码</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
        <div class="invalid-feedback" th:errors="*{confirmPassword}">[确认密码错误]</div>
      </div>

      <button type="submit" class="btn btn-primary w-100">确认修改</button>
    </form>

    <p class="text-center text-muted-app mt-3 mb-0">
      <a th:href="@{/profile}">返回个人主页</a>
    </p>
  </div>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
