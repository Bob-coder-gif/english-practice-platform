<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('我的词库')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">

    <div class="alert alert-success" th:if="${message}" th:text="${message}">[提示信息]</div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}">[错误信息]</div>

    <!-- 头部：数量和快捷入口 -->
    <div class="app-card p-4 mb-3 d-flex flex-wrap justify-content-between align-items-center gap-3">
        <div>
            <h1 class="h4 mb-1">我的词库</h1>
            <div class="text-muted-app small">
                已收藏 <span class="fw-semibold" th:text="${count}">0</span> / <span th:text="${maxSize}">600</span> 个单词
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2" th:if="${count > 0}">
            <a class="btn btn-primary btn-sm" th:href="@{/study(collection=true)}">学习我的词库</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dictation}">去听写</a>
        </div>
    </div>

    <!-- 搜索并收藏 -->
    <div class="app-card p-3 mb-3">
        <form class="mb-0" th:action="@{/collection}" method="get">
            <label for="collectionSearch" class="form-label small text-muted-app">
                搜索要收藏的单词或短语（考试词库 + 约 9.6 万词条的扩展词典）
            </label>
            <div class="input-group" style="max-width: 460px;">
                <input type="search" id="collectionSearch" name="q" class="form-control"
                       placeholder="输入英文或中文，如 give up、放弃"
                       th:value="${q}"
                       th:maxlength="${T(com.jay.englishpracticeplatform.service.WordService).MAX_KEYWORD_LENGTH}"
                       autocomplete="off" autocapitalize="off" spellcheck="false">
                <button type="submit" class="btn btn-primary">搜索</button>
                <a class="btn btn-outline-secondary" th:if="${q != ''}" th:href="@{/collection}">清除</a>
            </div>
        </form>

        <th:block th:if="${searchResults != null}">

            <!-- 结果一：words 表中的单词（考试词库，以及别人收藏过的扩展词） -->
            <h2 class="h6 text-muted-app mt-3 mb-2" th:if="${!searchResults.isEmpty()}">词库中的单词</h2>
            <div class="table-responsive" th:if="${!searchResults.isEmpty()}" th:data-highlight="${q}">
                <table class="table table-hover align-middle mb-0">
                    <tbody>
                    <tr th:each="w : ${searchResults}">
                        <td class="fw-semibold" style="width: 18%;">
                            <span data-highlight-text th:text="${w.spelling}">[单词]</span>
                            <span class="badge badge-ext ms-1" th:if="${w.extended}">扩展</span>
                        </td>
                        <td class="phonetic" style="width: 18%;">
                            <span th:if="${w.phonetic}" th:text="'/' + ${w.phonetic} + '/'">[音标]</span>
                        </td>
                        <td class="meaning" data-highlight-text th:text="${w.meaning}">[释义]</td>
                        <td class="text-end text-nowrap" style="width: 140px;">
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                    th:data-speak="${w.spelling}">🔊
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" disabled
                                    th:if="${collectedIds.contains(w.id)}">已收藏
                            </button>
                            <form class="d-inline" th:unless="${collectedIds.contains(w.id)}"
                                  th:action="@{/collection/add}" method="post" data-submit-once>
                                <input type="hidden" name="wordId" th:value="${w.id}">
                                <input type="hidden" name="q" th:value="${q}">
                                <button type="submit" class="btn btn-sm btn-primary">收藏</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <!-- 结果二：扩展词典中的词条（words 表中还没有的） -->
            <h2 class="h6 text-muted-app mt-3 mb-2" th:if="${!dictResults.isEmpty()}">
                扩展词典 <span class="badge badge-ext ms-1">扩展</span>
            </h2>
            <div class="table-responsive" th:if="${!dictResults.isEmpty()}" th:data-highlight="${q}">
                <table class="table table-hover align-middle mb-0">
                    <tbody>
                    <tr th:each="d : ${dictResults}">
                        <td class="fw-semibold" style="width: 18%;">
                            <span data-highlight-text th:text="${d.word}">[单词]</span>
                            <span class="badge text-bg-light ms-1" th:if="${d.phrase}">短语</span>
                        </td>
                        <td class="phonetic" style="width: 18%;">
                            <span th:if="${d.phonetic}" th:text="'/' + ${d.phonetic} + '/'">[音标]</span>
                        </td>
                        <td class="meaning" data-highlight-text th:text="${d.translation}">[释义]</td>
                        <td class="text-end text-nowrap" style="width: 140px;">
                            <button type="button" class="btn btn-sm btn-outline-secondary"
                                    th:data-speak="${d.word}">🔊
                            </button>
                            <form class="d-inline" th:action="@{/collection/add-entry}" method="post" data-submit-once>
                                <input type="hidden" name="entryId" th:value="${d.id}">
                                <input type="hidden" name="q" th:value="${q}">
                                <button type="submit" class="btn btn-sm btn-primary">收藏</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-text mt-2" th:if="${!searchResults.isEmpty() || !dictResults.isEmpty()}">
                每部分最多显示 20 个结果。英文按开头匹配，找不到时可以换个更准确的关键词
            </div>
            <div class="text-muted-app mt-3" th:if="${searchResults.isEmpty() && dictResults.isEmpty()}">
                没有找到匹配的单词或短语。
            </div>
        </th:block>
    </div>

    <!-- 已收藏的单词 -->
    <div class="app-card p-3">
        <h2 class="h6 text-muted-app mb-2">已收藏的单词</h2>

        <div class="table-responsive" th:if="${count > 0}">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th style="width: 18%;">单词</th>
                    <th style="width: 18%;">音标</th>
                    <th>释义</th>
                    <th style="width: 140px;"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${collectionPage.content}">
                    <td class="fw-semibold">
                        <span th:text="${c.word.spelling}">[单词]</span>
                        <span class="badge badge-ext ms-1" th:if="${c.word.extended}">扩展</span>
                    </td>
                    <td class="phonetic">
                        <span th:if="${c.word.phonetic}" th:text="'/' + ${c.word.phonetic} + '/'">[音标]</span>
                    </td>
                    <td class="meaning" th:text="${c.word.meaning}">[释义]</td>
                    <td class="text-end text-nowrap">
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                th:data-speak="${c.word.spelling}">🔊
                        </button>
                        <form class="d-inline" th:action="@{/collection/remove}" method="post" data-submit-once>
                            <input type="hidden" name="wordId" th:value="${c.word.id}">
                            <input type="hidden" name="page" th:value="${currentPage}">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">移除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center text-muted-app py-4" th:if="${count == 0}">
            我的词库还是空的。在上面搜索单词，点「收藏」就能加进来。
        </div>
    </div>

    <!-- 分页 -->
    <ul class="pagination justify-content-center my-3" th:if="${totalPages > 1}">
        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
            <a class="page-link" th:href="@{/collection(page=${currentPage - 1}, q=${q})}">上一页</a>
        </li>
        <li class="page-item active">
            <span class="page-link">
                <span th:text="${currentPage}">1</span> / <span th:text="${totalPages}">1</span>
            </span>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{/collection(page=${currentPage + 1}, q=${q})}">下一页</a>
        </li>
    </ul>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
