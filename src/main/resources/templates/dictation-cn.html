<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('听写汉语')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container" style="max-width: 720px;">

    <div class="app-card p-3 mb-3">
        <span class="fw-semibold">听写汉语</span>
        <span class="text-muted-app small">
            · <span th:text="${level.label}">[级别]</span>
            · <span th:text="${source.label}">[来源]</span>
            · 共 <span th:text="${#lists.size(questions)}">20</span> 题
        </span>
    </div>

    <form th:action="@{/dictation/cn}" method="post" data-submit-once>
        <div class="app-card p-3 mb-2" th:each="q, stat : ${questions}">
            <input type="hidden" th:name="|wordIds[${stat.index}]|" th:value="${q.wordId}">

            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="text-muted-app small" th:text="${stat.count} + '.'">1.</span>
                <span class="fs-5 fw-semibold" th:text="${q.spelling}">[单词]</span>
                <span class="phonetic small" th:if="${q.phonetic}" th:text="'/' + ${q.phonetic} + '/'">[音标]</span>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-auto"
                        th:data-speak="${q.spelling}">🔊</button>
            </div>

            <div class="list-group">
                <label class="list-group-item d-flex gap-2" th:each="opt, optStat : ${q.options}">
                    <input class="form-check-input flex-shrink-0 mt-1" type="radio"
                           th:name="|answers[${stat.index}]|" th:value="${opt.wordId}">
                    <span class="meaning small" th:text="${opt.meaning}">[释义]</span>
                </label>
            </div>
        </div>

        <div class="d-grid my-4">
            <button type="submit" class="btn btn-primary btn-lg">交卷</button>
        </div>
    </form>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
