<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==================== 公共 head ==================== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 英语练习打卡平台'">[标题]</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<!-- ==================== 导航栏 ==================== -->
<nav th:fragment="navbar" class="navbar navbar-expand-md app-navbar mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">英语练习打卡平台</a>

        <!-- 手机屏幕上，菜单折叠成这个按钮 -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <!-- 已登录才显示功能菜单 -->
            <ul class="navbar-nav me-auto" th:if="${loginUser}">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/words}"
                       th:classappend="${currentPath == '/words'} ? 'active'">单词列表</a>
                </li>
            </ul>

            <!-- 搜索：在全部级别中搜索，结果显示在单词列表页 -->
            <form class="nav-search my-2 my-md-0 me-md-3" th:if="${loginUser}"
                  th:action="@{/words}" method="get" role="search">
                <div class="input-group input-group-sm">
                    <input type="search" name="q" class="form-control"
                           placeholder="搜索单词或中文"
                           th:value="${q}" maxlength="30"
                           autocomplete="off" autocapitalize="off" spellcheck="false">
                    <button type="submit" class="btn btn-primary">搜索</button>
                </div>
            </form>

            <!-- 右侧：用户信息 -->
            <div class="ms-auto d-flex align-items-center gap-2">

                <!-- 已登录：头像 + 用户名，点击展开个人菜单 -->
                <div class="dropdown" th:if="${loginUser}">
                    <button type="button" class="nav-user dropdown-toggle"
                            data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
                        <span class="avatar avatar-sm"
                              th:text="${#strings.toUpperCase(#strings.substring(loginUser.username, 0, 1))}">J</span>
                        <span class="fw-semibold" th:text="${loginUser.username}">[用户名]</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <a class="dropdown-item" th:href="@{/profile}"
                               th:classappend="${currentPath == '/profile'} ? 'active'">个人主页</a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/stats}"
                               th:classappend="${currentPath == '/stats'} ? 'active'">学习统计</a>
                        </li>
                        <li>
                            <a class="dropdown-item" th:href="@{/checkin}"
                               th:classappend="${currentPath == '/checkin'} ? 'active'">打卡日历</a>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button type="submit" class="dropdown-item">退出登录</button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- 未登录 -->
                <th:block th:unless="${loginUser}">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/login}">登录</a>
                    <a class="btn btn-sm btn-primary" th:href="@{/register}">注册</a>
                </th:block>
            </div>
        </div>
    </div>
</nav>

<!-- ==================== 页面底部：页脚、更新弹窗、公共脚本 ==================== -->
<!-- 所有页面都在 body 最后引用这个片段，所以页脚和弹窗也放在这里，不用逐个页面添加 -->
<th:block th:fragment="scripts">

    <!-- 页脚：不登录也能看到 -->
    <footer class="container text-center text-muted-app small py-4 mt-4">
        <a class="text-reset text-decoration-none" th:href="@{/changelog}">更新日志</a>
        <span class="mx-2">·</span>
        <a class="text-reset text-decoration-none"
           href="https://github.com/Bob-coder-gif/english-practice-platform"
           target="_blank" rel="noopener noreferrer">项目源码</a>
    </footer>

    <!-- 登录后弹出最近一次更新：只有 Model 里有 popupChangelog 时才输出；data-auto-show 让 app.js 自动打开它 -->
    <div class="modal fade" id="changelogModal" tabindex="-1" aria-labelledby="changelogModalTitle"
         th:if="${popupChangelog}" data-auto-show>
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="changelogModalTitle">
                        网站更新：<span th:text="${popupChangelog.title}">[标题]</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
                </div>
                <div class="modal-body">
                    <div class="text-muted-app small mb-2"
                         th:text="${#temporals.format(popupChangelog.date, 'yyyy-MM-dd')}">2026-10-13</div>
                    <ul class="mb-0 ps-3">
                        <li th:each="item : ${popupChangelog.items}" th:text="${item}">[更新内容]</li>
                    </ul>
                </div>
                <div class="modal-footer">
                    <a class="btn btn-outline-secondary" th:href="@{/changelog}">查看全部更新</a>
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">我知道了</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
