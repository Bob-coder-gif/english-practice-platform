<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">英语练习打卡平台</title>
</head>
<body>
    <h1 th:text="${title}">英语练习打卡平台</h1>

    <p th:if="${message}" th:text="${message}" style="color: green;">提示信息</p>

    <p>当前词库单词数：<span th:text="${wordCount}">0</span></p>

    <!-- 已登录 -->
    <div th:if="${loginUser}">
        <p>欢迎你，<strong th:text="${loginUser.username}">用户名</strong>！</p>
        <p><a th:href="@{study}">开始背单词</a> </p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">退出登录</button>
        </form>
    </div>

    <!-- 未登录 -->
    <div th:unless="${loginUser}">
        <a th:href="@{/register}">注册</a>
        <a th:href="@{/login}">登录</a>
    </div>
</body>
</html>
