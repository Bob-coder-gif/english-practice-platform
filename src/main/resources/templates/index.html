<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('首页')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">

    <div class="alert alert-success" th:if="${message}" th:text="${message}">[提示信息]</div>

    <!-- 已登录 -->
    <th:block th:if="${loginUser}">
        <div class="app-card p-4 mb-4">
            <h1 class="h4 mb-1">欢迎回来，<span th:text="${loginUser.username}">[用户名]</span></h1>
            <p class="text-muted-app mb-0">
                词库共 <span th:text="${wordCount}">0</span> 个单词，今天也要坚持哦
            </p>
        </div>

        <div class="row g-3">
            <div class="col-6 col-md-3">
                <a th:href="@{/study}" class="app-card d-block p-4 text-center text-decoration-none">
                    <div class="fs-2">📖</div>
                    <div class="fw-semibold text-dark">学习新单词</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a th:href="@{/review}" class="app-card d-block p-4 text-center text-decoration-none">
                    <div class="fs-2">🔁</div>
                    <div class="fw-semibold text-dark">复习</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a th:href="@{/mistakes}" class="app-card d-block p-4 text-center text-decoration-none">
                    <div class="fs-2">📕</div>
                    <div class="fw-semibold text-dark">错题本</div>
                </a>
            </div>
            <div class="col-6 col-md-3">
                <a th:href="@{/words}" class="app-card d-block p-4 text-center text-decoration-none">
                    <div class="fs-2">📚</div>
                    <div class="fw-semibold text-dark">单词列表</div>
                </a>
            </div>
        </div>
    </th:block>

    <!-- 未登录 -->
    <div class="app-card p-5 text-center" th:unless="${loginUser}">
        <h1 class="h3 mb-3">英语练习打卡平台</h1>
        <p class="text-muted-app">
            覆盖高考、四六级、考研、雅思共 <span th:text="${wordCount}">0</span> 个单词，
            间隔重复帮你记得更牢
        </p>
        <a class="btn btn-primary me-2" th:href="@{/register}">立即注册</a>
        <a class="btn btn-outline-secondary" th:href="@{/login}">登录</a>
    </div>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
