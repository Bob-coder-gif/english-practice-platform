<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('登录')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">
    <div class="app-card p-4 mx-auto" style="max-width: 420px;">
        <h1 class="h4 mb-4 text-center">登录</h1>


        <div class="alert alert-success" th:if="${message}" th:text="${message}">[提示信息]</div>
        <div class="alert alert-danger" th:if="${param.error}">用户名或密码错误</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                <label class="form-check-label" for="remember-me">记住我（14 天内免登录）</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>

        <p class="text-center text-muted-app mt-3 mb-0">
            还没有账号？<a th:href="@{/register}">去注册</a>
        </p>
    </div>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
