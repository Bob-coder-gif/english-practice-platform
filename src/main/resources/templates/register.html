<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('注册')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">
    <div class="app-card p-4 mx-auto" style="max-width: 420px;">
        <h1 class="h4 mb-4 text-center">注册</h1>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" id="username" class="form-control"
                       th:field="*{username}" th:errorclass="is-invalid">
                <div class="form-text">3～20 位字母、数字或下划线</div>
                <div class="invalid-feedback" th:errors="*{username}">[用户名错误]</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" id="password" name="password" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="form-text">6～32 位</div>
                <div class="invalid-feedback" th:errors="*{password}">[密码错误]</div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">确认密码</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{confirmPassword}">[确认密码错误]</div>
            </div>

            <button type="submit" class="btn btn-primary w-100">注册</button>
        </form>

        <p class="text-center text-muted-app mt-3 mb-0">
            已有账号？<a th:href="@{/login}">去登录</a>
        </p>
    </div>
</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
