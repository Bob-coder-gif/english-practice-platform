<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('复习')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container" style="max-width: 720px;">

    <div class="app-card p-3 mb-3 d-flex justify-content-between align-items-center">
        <span>待复习 <strong class="fs-5" th:text="${dueCount}">0</strong> 个</span>
        <a th:href="@{/mistakes}">查看错题本 →</a>
    </div>

    <!-- 有到期的单词 -->
    <th:block th:if="${userWord}">
        <div class="btn-group btn-group-sm mb-3">
            <button type="button" class="btn btn-outline-secondary" data-mode="show-en">看英文想中文</button>
            <button type="button" class="btn btn-outline-secondary" data-mode="show-cn">看中文想英文</button>
        </div>

        <div class="app-card p-4 text-center" data-flashcard>
            <div data-side="en">
                <div class="display-6 fw-semibold mb-1" th:text="${userWord.word.spelling}">[单词]</div>
                <div class="phonetic mb-2" th:if="${userWord.word.phonetic}"
                     th:text="'/' + ${userWord.word.phonetic} + '/'">[音标]
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary"
                        th:data-speak="${userWord.word.spelling}"
                        th:data-autospeak="${userWord.word.spelling}">🔊 发音
                </button>
            </div>

            <div data-side="cn" class="meaning mt-3 fs-5" hidden th:text="${userWord.word.meaning}">[释义]</div>

            <button type="button" class="btn btn-link mt-3" data-reveal>显示释义</button>

            <p class="text-muted-app small mt-2 mb-0">
                认识 <span th:text="${userWord.knownCount}">0</span> 次 ·
                不认识 <span th:text="${userWord.unknownCount}">0</span> 次 ·
                连续认识 <span th:text="${userWord.streak}">0</span> 次
            </p>

            <form class="d-flex justify-content-center gap-3 mt-3" data-submit-once
                  th:action="@{/review/answer}" method="post">
                <input type="hidden" name="wordId" th:value="${userWord.word.id}">
                <button type="submit" name="known" value="true" class="btn btn-primary px-4">认识</button>
                <button type="submit" name="known" value="false" class="btn btn-outline-secondary px-4">不认识</button>
            </form>
        </div>
    </th:block>

    <!-- 没有到期的单词 -->
    <div class="app-card p-5 text-center" th:unless="${userWord}">
        <div class="fs-1 mb-2">✅</div>
        <p class="mb-3">当前没有需要复习的单词</p>
        <a class="btn btn-primary" th:href="@{/study}">去学习新单词</a>
    </div>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
