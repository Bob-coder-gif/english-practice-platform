<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>复习 - 英语练习打卡平台</title>
    <style>
        .card { border: 1px solid #ccc; padding: 24px; margin-top: 16px; max-width: 480px; }
        .spelling { font-size: 36px; margin: 0 0 8px; }
        .phonetic { color: #666; margin: 0 0 16px; }
        .meaning { white-space: pre-line; margin: 16px 0; }
        .stats { color: #666; font-size: 14px; }
        .actions { margin-top: 16px; }
        .actions button { font-size: 18px; padding: 8px 24px; margin-right: 12px; }
    </style>
</head>
<body>
<h1>复习</h1>
<p><a th:href="@{/}">返回首页</a> | <a th:href="@{/mistakes}">错题本</a></p>

<p>待复习：<span th:text="${dueCount}">0</span> 个</p>

<!-- 有到期的单词 -->
<div class="card" th:if="${userWord}">
    <p class="spelling" th:text="${userWord.word.spelling}">[单词]</p>
    <p class="phonetic" th:if="${userWord.word.phonetic}"
       th:text="'/' + ${userWord.word.phonetic} + '/'">[音标]</p>

    <p class="stats">
        认识 <span th:text="${userWord.knownCount}">0</span> 次，
        不认识 <span th:text="${userWord.unknownCount}">0</span> 次，
        连续认识 <span th:text="${userWord.streak}">0</span> 次
    </p>

    <button type="button" id="speak-button" th:data-word="${userWord.word.spelling}">🔊 发音</button>
    <button type="button" id="toggle-meaning">显示释义</button>

    <p class="meaning" id="meaning" hidden th:text="${userWord.word.meaning}">[释义]</p>

    <form class="actions" id="answer-form" th:action="@{/review/answer}" method="post">
        <input type="hidden" name="wordId" th:value="${userWord.word.id}">
        <button type="submit" name="known" value="true">认识</button>
        <button type="submit" name="known" value="false">不认识</button>
    </form>
</div>

<!-- 没有到期的单词 -->
<div th:unless="${userWord}">
    <p>✅ 当前没有需要复习的单词，去 <a th:href="@{/study}">学习新单词</a> 吧！</p>
</div>

<script>
    const speakButton = document.getElementById('speak-button');
    const toggleButton = document.getElementById('toggle-meaning');
    const meaning = document.getElementById('meaning');
    const answerForm = document.getElementById('answer-form');

    if (speakButton) {
        speakButton.addEventListener('click', function () {
            const utterance = new SpeechSynthesisUtterance(speakButton.dataset.word);
            utterance.lang = 'en-US';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        });
    }

    if (toggleButton) {
        toggleButton.addEventListener('click', function () {
            meaning.hidden = !meaning.hidden;
            toggleButton.textContent = meaning.hidden ? '显示释义' : '隐藏释义';
        });
    }

    if (answerForm) {
        let submitted = false;
        answerForm.addEventListener('submit', function (event) {
            if (submitted) {
                event.preventDefault();
            }
            submitted = true;
        });
    }
</script>
</body>
</html>
