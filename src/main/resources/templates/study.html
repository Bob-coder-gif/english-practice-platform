<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('学习新单词')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container" style="max-width: 720px;">

    <!-- 级别切换 -->
    <ul class="nav nav-pills mb-3">
        <li class="nav-item" th:each="lv : ${levels}">
            <a class="nav-link"
               th:href="@{/study(level=${lv})}"
               th:text="${lv.label}"
               th:classappend="${lv == currentLevel} ? 'active'">[级别]</a>
        </li>
    </ul>

    <!-- 学习进度 -->
    <div class="app-card p-3 mb-3">
        <div class="d-flex justify-content-between mb-2">
            <span><span th:text="${currentLevel.label}">[级别]</span>学习进度</span>
            <span class="text-muted-app">
                <span th:text="${learnedCount}">0</span> / <span th:text="${totalCount}">0</span>
            </span>
        </div>
        <div class="progress" style="height: 8px;">
            <div class="progress-bar"
                 th:style="'width: ' + ${totalCount > 0 ? learnedCount * 100 / totalCount : 0} + '%'"></div>
        </div>
    </div>

    <!-- 还有新单词 -->
    <th:block th:if="${word}">
        <!-- 模式切换 -->
        <div class="btn-group btn-group-sm mb-3">
            <button type="button" class="btn btn-outline-secondary" data-mode="show-en">看英文想中文</button>
            <button type="button" class="btn btn-outline-secondary" data-mode="show-cn">看中文想英文</button>
        </div>

        <div class="app-card p-4 text-center" data-flashcard>
            <!-- 英文面 -->
            <div data-side="en">
                <div class="display-6 fw-semibold mb-1" th:text="${word.spelling}">[单词]</div>
                <div class="phonetic mb-2" th:if="${word.phonetic}"
                     th:text="'/' + ${word.phonetic} + '/'">[音标]
                </div>
                <button type="button" class="btn btn-sm btn-outline-secondary"
                        th:data-speak="${word.spelling}"
                        th:data-autospeak="${word.spelling}">🔊 发音
                </button>
            </div>

            <!-- 中文面：默认隐藏，由 app.js 根据模式决定 -->
            <div data-side="cn" class="meaning mt-3 fs-5" hidden th:text="${word.meaning}">[释义]</div>

            <button type="button" class="btn btn-link mt-3" data-reveal>显示释义</button>

            <form class="d-flex justify-content-center gap-3 mt-3" data-submit-once
                  th:action="@{/study/answer}" method="post">
                <input type="hidden" name="wordId" th:value="${word.id}">
                <input type="hidden" name="level" th:value="${currentLevel}">
                <button type="submit" name="known" value="true" class="btn btn-primary px-4">认识</button>
                <button type="submit" name="known" value="false" class="btn btn-outline-secondary px-4">不认识</button>
            </form>
        </div>
    </th:block>

    <!-- 全部学完 -->
    <div class="app-card p-5 text-center" th:unless="${word}">
        <div class="fs-1 mb-2">🎉</div>
        <p class="mb-0">这个级别的单词已经全部学过了！</p>
    </div>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
