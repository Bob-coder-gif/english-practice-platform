<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('单词列表')}"></head>
<body>
<nav th:replace="~{fragments/common :: navbar}"></nav>

<main class="container">

    <!-- 级别切换 -->
    <ul class="nav nav-pills mb-3">
        <li class="nav-item" th:each="lv : ${levels}">
            <a class="nav-link"
               th:href="@{/words(level=${lv})}"
               th:text="${lv.label}"
               th:classappend="${lv == currentLevel} ? 'active'">[级别]</a>
        </li>
    </ul>

    <div class="app-card p-3">
        <p class="text-muted-app mb-2">
            <span th:text="${currentLevel.label}">[级别]</span>
            共 <span th:text="${wordPage.totalElements}">0</span> 个单词
        </p>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th style="width: 18%;">单词</th>
                    <th style="width: 18%;">音标</th>
                    <th>释义</th>
                    <th style="width: 60px;"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="w : ${wordPage.content}">
                    <td class="fw-semibold" th:text="${w.spelling}">[单词]</td>
                    <td class="phonetic">
                        <span th:if="${w.phonetic}" th:text="'/' + ${w.phonetic} + '/'">[音标]</span>
                    </td>
                    <td class="meaning" th:text="${w.meaning}">[释义]</td>
                    <td>
                        <button type="button" class="btn btn-sm btn-outline-secondary"
                                th:data-speak="${w.spelling}">🔊</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 分页 -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 my-3">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/words(level=${currentLevel}, page=1)}">首页</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/words(level=${currentLevel}, page=${currentPage - 1})}">上一页</a>
            </li>
            <li class="page-item active">
                <span class="page-link">
                    <span th:text="${currentPage}">1</span> / <span th:text="${totalPages}">1</span>
                </span>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/words(level=${currentLevel}, page=${currentPage + 1})}">下一页</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/words(level=${currentLevel}, page=${totalPages})}">末页</a>
            </li>
        </ul>

        <form class="d-flex align-items-center gap-2" th:action="@{/words}" method="get">
            <input type="hidden" name="level" th:value="${currentLevel}">
            <div class="input-group input-group-sm" style="width: 180px;">
                <span class="input-group-text">跳到</span>
                <input type="number" name="page" class="form-control" min="1"
                       th:max="${totalPages}" th:value="${currentPage}" required>
                <button type="submit" class="btn btn-outline-secondary">GO</button>
            </div>
        </form>
    </div>

</main>

<th:block th:replace="~{fragments/common :: scripts}"></th:block>
</body>
</html>
